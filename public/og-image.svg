<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="T-Racers MEC — Tanta University Formula Student Team">
  <defs>
    <!-- Dark navy background with subtle radial glow -->
    <radialGradient id="bg" cx="20%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1a1530" />
      <stop offset="55%" stop-color="#0b0d1d" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Red gradient for the headline -->
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fecaca" />
      <stop offset="55%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Soft red glow under the headline -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#dc2626" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <!-- Repeating diagonal racing-stripe pattern (subtle) -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="48" height="48" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#dc2626" stroke-width="2" stroke-opacity="0.05" />
    </pattern>

    <!-- Speed lines on the right edge -->
    <linearGradient id="speedFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#dc2626" stop-opacity="0" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#stripes)" />

  <!-- Speed lines (decorative, right side) -->
  <g stroke="url(#speedFade)" stroke-linecap="round">
    <line x1="800"  y1="120" x2="1190" y2="120" stroke-width="2" opacity="0.5" />
    <line x1="850"  y1="170" x2="1190" y2="170" stroke-width="3" opacity="0.7" />
    <line x1="780"  y1="220" x2="1190" y2="220" stroke-width="2" opacity="0.4" />
    <line x1="900"  y1="270" x2="1190" y2="270" stroke-width="2" opacity="0.5" />
    <line x1="830"  y1="350" x2="1190" y2="350" stroke-width="3" opacity="0.65" />
    <line x1="880"  y1="400" x2="1190" y2="400" stroke-width="2" opacity="0.5" />
    <line x1="800"  y1="450" x2="1190" y2="450" stroke-width="2" opacity="0.4" />
    <line x1="900"  y1="510" x2="1190" y2="510" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Red glow behind headline -->
  <ellipse cx="450" cy="345" rx="380" ry="160" fill="url(#redGlow)" />

  <!-- Eyebrow chip -->
  <g transform="translate(80,170)">
    <rect x="0" y="0" rx="22" ry="22" width="280" height="44" fill="rgba(15,23,42,0.6)" stroke="#dc2626" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="140" y="29" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="16" font-weight="500" letter-spacing="3" fill="#fca5a5"
          text-anchor="middle">FORMULA STUDENT · EGYPT</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80,245)">
    <text font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="110" font-weight="800" letter-spacing="-3"
          fill="url(#redText)">
      <tspan x="0" dy="0">T-Racers</tspan>
      <tspan x="0" dy="110" fill="#f8fafc" font-weight="700">MEC</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="510" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    Tanta University Formula Student Racing Team
  </text>

  <!-- Domain footer -->
  <g transform="translate(80,565)">
    <circle cx="9" cy="9" r="8" fill="#dc2626" />
    <text x="28" y="15" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="1">
      tracersmec.com
    </text>
  </g>

  <!-- Bottom-right brand mark (initials in a circle) -->
  <g transform="translate(1000,420)">
    <circle cx="80" cy="80" r="80" fill="#0b0d1d" stroke="#dc2626" stroke-width="3" />
    <text x="80" y="100" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="62" font-weight="800" fill="url(#redText)" text-anchor="middle"
          letter-spacing="-2">T-R</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="615" width="1200" height="15" fill="#dc2626" />
</svg>
